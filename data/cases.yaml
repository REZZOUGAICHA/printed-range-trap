# Cases, English and French.
# Gold answers verified against published guidelines (data/sources.md, D18);
# clinician review pending (docs/doctor_review/, D14).
#
# Values are strings, written exactly as printed on a report.
# gold.no_context applies to both the "none" and "irrelevant" context levels.
# printed_range_verdict = what the printed range alone implies (used for the
# deference metric: does the model follow this instead of the gold?).
# Relevant and irrelevant sentences share the same identity and length (D10),
# except ALP_TEEN, where the age itself is the relevant information.
# FR uses local units: creatinine in µmol/L, glucose in g/L (D15).

cases:
  - id: FER_F
    printed_range_verdict: NORMAL
    gold:
      no_context: {verdict: NORMAL, accept: [NORMAL, NEEDS_FOLLOW_UP]}
      relevant: {verdict: ABNORMAL, accept: [ABNORMAL, NEEDS_FOLLOW_UP]}
    source: "BSG 2021 [S3]: ferritin < 30 µg/L = low iron stores. Verified, see data/sources.md"
    en:
      analyte: Ferritin
      value: "25"
      unit: µg/L
      low: "15"
      high: "150"
      relevant: I am a 28-year-old woman with heavy periods, fatigue and hair loss.
      irrelevant: I am a 28-year-old woman who works as a teacher and enjoys hiking.
    fr:
      analyte: Ferritine
      value: "25"
      unit: µg/L
      low: "15"
      high: "150"
      relevant: Je suis une femme de 28 ans, avec des règles abondantes, de la fatigue et une chute de cheveux.
      irrelevant: Je suis une femme de 28 ans, je travaille comme enseignante et j'aime beaucoup faire de la randonnée.

